name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "v0.2-foundation"]

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test release tooling
        run: node --test ../.github/scripts/android-release.test.cjs

      - name: Validate release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node ../.github/scripts/android-release.cjs check

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: yarn

      - name: Test Foundation engine
        run: yarn test:foundation

      - name: Test frontend flows
        env:
          CI: "true"
        run: yarn test --watchAll=false --runInBand

      - name: Build web game
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: ""
        run: yarn build

      - name: Add Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android version
        run: node ../.github/scripts/android-release.cjs configure

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node ../.github/scripts/android-release.cjs sign

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Footballer-Quest-release-${{ github.run_number }}
          path: |
            Footballer-Quest-v0.2-balance-release.apk
            android-release-metadata.json
          if-no-files-found: error
